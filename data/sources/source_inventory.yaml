# Source feasibility inventory — Phase 1
#
# Purpose: record every candidate source considered for Jeonbuk / metropolitan
# job-posting data, whether it is actually usable inside this hackathon
# workspace, and exactly what blocks it. Nothing in this file is a claim that
# data was collected — see `status` and `blockers` per source.
#
# Checked: 2026-09-12 (see docs/data/METHODOLOGY.md for the research trail).

inventory_version: "1.0.0"
checked_date: "2026-09-12"

sources:
  - source_name: "고용24 / 워크넷 채용정보 Open API (한국고용정보원, data.go.kr)"
    access_method: "REST Open API via data.go.kr; requires a 인증키 (service key) issued after data.go.kr account signup and per-API 활용신청 (usage application)."
    license_terms_status: >
      Public-data Open API distributed under 공공데이터포털 terms. Historically
      permits reuse of the structured fields returned by the API (title,
      occupation code, region code, employment type, salary band, dates,
      source URL) for stated non-commercial/hackathon purposes, subject to the
      exact terms shown on the per-API application page at the time of
      approval. Full free-text postings are not guaranteed to be included in
      the API response; some fields may be summarized rather than the
      original wording. TERMS MUST BE RE-READ at the moment a real key is
      issued, before any redistribution decision is made.
    date_range: "Rolling/current postings only; no fixed historical date range confirmed without an approved key."
    jeonbuk_count_by_occupation: "UNKNOWN — cannot query without an approved 인증키. Not estimated or invented."
    metro_count: "UNKNOWN — same blocker."
    employment_type_availability: "Documented in the API's 공통코드 (common code) reference (data.go.kr, 한국고용정보원_워크넷 공통코드), which is itself queryable without blocking on the key for postings."
    full_text_redistributable: "UNCONFIRMED — must be reconfirmed against the license text shown at key-issuance time, and re-checked per field before any public-repo redistribution."
    blockers:
      - "No data.go.kr account / service key available inside this agent session. Key issuance requires a human to sign up, agree to terms, and submit a usage-purpose application through the web UI — this cannot be completed non-interactively."
      - "Approval for some data.go.kr APIs is manual and can take 1-2 business days."
    status: "blocked_no_credentials"

  - source_name: "사람인 / 잡코리아 / 잡플래닛 (민간 채용 플랫폼)"
