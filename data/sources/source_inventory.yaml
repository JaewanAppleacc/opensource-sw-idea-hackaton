overall_conclusion: >
  As of 2026-09-12, no real Jeonbuk/metropolitan postings have been obtained.
  The only technically-plausible, policy-compliant public source identified
  (고용24 Open API) requires a human-completed credential application that
  this agent session cannot perform; the official public specification is
  documented, but no live XML mapping has been validated
  (see docs/acquisition/WORK24_API_NOTES.md). The data/evaluation track
  therefore proceeds by (1) building the full rubric, schema, annotation,
  validation, split, statistics, and evaluation pipeline against
  clearly-labeled synthetic fixtures, and (2) documenting real data
  acquisition as the first remaining manual step before any "gold" or
  population claim can be made. No postings or statistics have been invented
  and presented as real.

  2026-09-12 update (Parallel task D1): reproducible acquisition tooling for
  both paths now exists — scripts/acquisition/work24_client.py (dry-run
  only, refuses live calls until a human validates the response mapping
  and WORK24_SERVICE_KEY) and scripts/acquisition/manual_intake.py (parses
  human-supplied posting text into the shared schema, gates full-text
  redistribution on a per-record `redistribution_permission` field). The
  team has chosen the manual-intake path for this pass due to API
  key-issuance friction, but zero real postings have been supplied to any
  agent session yet — see REAL_DATA_ACQUISITION_HANDOFF.md for the current
  BLOCKED_INSUFFICIENT_SAMPLE decision and the exact next human action.
