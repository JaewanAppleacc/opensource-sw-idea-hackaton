# Source feasibility inventory — Phase 1
#
# Purpose: record every candidate source considered for Jeonbuk / metropolitan
# job-posting data, whether it is actually usable inside this hackathon
# workspace, and exactly what blocks it. Nothing in this file is a claim that
# data was collected — see `status` and `blockers` per source.
#
# Checked: 2026-09-12 (see docs/data/METHODOLOGY.md for the research trail).

inventory_version: "1.2.0"
checked_date: "2026-09-13"

sources:
  - source_name: "고용24 채용정보 Open API (한국고용정보원)"
    access_method: >
      Work24 Open API requiring an approved 인증키. RE-CONFIRMED 2026-09-12:
      the legacy 워크넷 Open API at
      openapi.work.go.kr has been shut down ("워크넷 OPEN-API서비스가
      종료되었습니다") and merged into the 고용24 (Work24) Open API at
      work24.go.kr (https://www.work24.go.kr/cm/e/a/0110/selectOpenApiIntro.do).
      The official public service pages expose the list/detail endpoints,
      core parameter names, required XML format, and detail fields. An issued
      key and a live response mapping check are still required. See
      docs/acquisition/WORK24_API_NOTES.md.
    license_terms_status: >
      The official Work24 detail-service page requires a link back to the
      Work24 detail page and attribution, and states that unauthorized copying
      and distribution are prohibited. Treat full text as non-redistributable
      unless the terms attached to the issued key explicitly allow publishing it.
    date_range: "Rolling/current postings only; no fixed historical date range confirmed without an approved key."
    jeonbuk_count_by_occupation: "UNKNOWN — cannot query without an approved 인증키. Not estimated or invented."
    metro_count: "UNKNOWN — same blocker."
    employment_type_availability: "Documented in the API's 공통코드 (common code) reference (data.go.kr, 한국고용정보원_워크넷 공통코드), which is itself queryable without blocking on the key for postings."
    full_text_redistributable: "No by default — the detail API documents jobCont, but the official page prohibits unauthorized reproduction/distribution. Reconfirm approved-use terms before any public-repo publication."
    blockers:
      - "No approved Work24 service key is available inside this agent session. Key issuance requires a human application."
      - "The project's XML mapping and exact sampling-filter behavior have not been verified against a live response."
    status: "blocked_no_credentials"

  - source_name: "User-provided postings — manual intake (active path, Parallel task D1 / D2 real-postings pass)"
    access_method: >
      A team member (or, on 2026-09-12, this agent acting under the same
      manual-intake rule) opens the public 고용24 채용정보 상세 페이지
      (www.work24.go.kr) for one posting at a time via the site's own
      "채용정보 상세검색" search UI — never the Open API, never a bulk
      scraper, never a private platform — and transcribes the visible text
      verbatim into the plain-text template in
      docs/acquisition/MANUAL_INTAKE_GUIDE.md, one posting per block, with a
      fixed neutral sampling rule (same keyword/region/employment-type
      filters both regions, sorted by 최근등록일순, taken from the top of
      the list, factual-only exclusions). Ingested with
      scripts/acquisition/manual_intake.py.
    license_terms_status: "Case-by-case per posting via the required `redistribution_permission` (yes/no/unknown) field. `unknown`/`no` keep the full text out of the public data/intake/real_postings.jsonl entirely (private-only, in data/private/intake_raw/, gitignored); only `yes` allows the public record to carry full_text. All 20 records ingested 2026-09-12 are `unknown` — 고용24's own detail-service page requires attribution/backlink and states unauthorized reproduction is prohibited, and no approved-use terms have been separately confirmed, so redistribution defaults to unknown, not assumed."
    date_range: "Depends on when each batch is supplied; recorded per-record as a real `collection_date`. All 20 records ingested 2026-09-12 were also viewed/collected on 2026-09-12 (same-day collection, within the 30-day window fixed in docs/acquisition/REAL_SOURCE_SEARCH_LOG.md)."
    jeonbuk_count_by_occupation: "10 real postings ingested 2026-09-12 for 생산직(제조 조립원)/정규직 (JB-01..JB-10), plus one representative 식품공학 기술자 및 연구원/정규직 demo posting (JB-00) ingested 2026-09-13."
    metro_count: "10 real production/assembly postings ingested 2026-09-12 (MET-01..MET-10), plus one representative food R&D posting (MET-00) ingested 2026-09-13."
    employment_type_availability: "Recorded per-record from the human-supplied header. All 22 records are 정규직, based on 고용24's official '기간의 정함이 없는 근로계약' label."
    full_text_redistributable: "Per-record, from redistribution_permission; all 22 real records are `unknown` pending an explicit terms re-check, so public full_text remains null and the real text lives only in the gitignored private intake directory."
    blockers:
      - "None for ingestion itself — 10:10 real postings for 생산직(제조 조립원)/정규직 are now ingested (2026-09-12). Two humans have not yet independently annotated them and no human has confirmed the duties/tools_or_skills boundary judgeability check (human_boundary_review_completed is null in data/intake/occupation_feasibility.json by design) — see REAL_DATA_ACQUISITION_HANDOFF.md for the exact remaining steps."
    status: "min_sample_ingested_pending_human_review"

