occupation_feasibility_decision:
  chosen_occupation: "생산직(제조 조립원) — production/assembly line worker, 정규직 (regular/full-time)"
  status: >
    CONFIRMED AGAINST A REAL 10:10 SAMPLE as of 2026-09-12 (10 Jeonbuk +
    10 metro real postings ingested from 고용24, same keyword/employment-type
    filters, same day of collection). Still not gold — no human annotation or
    adjudication has occurred, and human_boundary_review_completed remains
    null in data/intake/occupation_feasibility.json until a human explicitly
    sets it. See docs/acquisition/REAL_SOURCE_SEARCH_LOG.md for the full
    cross-domain (금융·경영 / IT·디지털 / 생산·기술) feasibility scan that
    led to this choice, including the close runner-up (회계 사무원) and the
    two candidates excluded for occupation mismatch during collection.
  see: "data/occupation_selection.md, docs/acquisition/REAL_SOURCE_SEARCH_LOG.md"

overall_conclusion: >
  As of 2026-09-12, no real Jeonbuk/metropolitan postings have been obtained.
  The only technically-plausible, policy-compliant public source identified
  (고용24 Open API) requires a human-completed credential application that
  this agent session cannot perform; the official public specification is
  documented, but no live XML mapping has been validated
  (see docs/acquisition/WORK24_API_NOTES.md). The data/evaluation track
  therefore proceeds by (1) building the full rubric, schema, annotation,
  validation, split, statistics, and evaluation pipeline against
  clearly-labeled synthetic fixtures, and (2) documenting real data
  acquisition as the first remaining manual step before any "gold" or
  population claim can be made. No postings or statistics have been invented
  and presented as real.

  2026-09-12 update (Parallel task D1): reproducible acquisition tooling for
  both paths now exists — scripts/acquisition/work24_client.py (dry-run
  only, refuses live calls until a human validates the response mapping
  and WORK24_SERVICE_KEY) and scripts/acquisition/manual_intake.py (parses
  human-supplied posting text into the shared schema, gates full-text
  redistribution on a per-record `redistribution_permission` field). The
  team chose the manual-intake path due to API key-issuance friction.

  2026-09-12 second update (real-postings-comparable-domain pass): using
  the manual-intake path against 고용24's own public search UI (not the
  API, not a scraper), an agent session researched search-result feasibility
  across three candidate domains (금융·경영 / IT·디지털 / 생산·기술; see
  docs/acquisition/REAL_SOURCE_SEARCH_LOG.md), selected 생산직(제조
  조립원)/정규직, and ingested a real 10 Jeonbuk + 10 metropolitan sample
  (same query, same day, same employment-type filter). The API path
  (work24_client.py) remains blocked_no_credentials — this update is about
  the manual-intake path only. See REAL_DATA_ACQUISITION_HANDOFF.md for the
  current MIN_SAMPLE_MET_PENDING_HUMAN_BOUNDARY_REVIEW decision and the
  exact remaining human action (independent two-person annotation and
  boundary-judgeability confirmation).
